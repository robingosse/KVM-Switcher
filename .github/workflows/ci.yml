name: CI

on:
  push:
  pull_request:

jobs:
  host-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile host client
        run: python -m py_compile kvmctl.py

  firmware-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanity check firmware files
        run: |
          test -f firmware/main.c
          test -f firmware/CMakeLists.txt
          grep -q 'GPIO_BY_INPUT\[4\] = {0, 2, 4, 6}' firmware/main.c
