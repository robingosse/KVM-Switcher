name: CI

on:
  push:
  pull_request:

jobs:
  host-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile host client
        run: python -m py_compile kvmctl.py

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi ninja-build

      - name: Checkout Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.1.1
          path: pico-sdk
          submodules: recursive

      - name: Configure firmware
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: cmake -S firmware -B build -G Ninja

      - name: Build firmware
        run: cmake --build build --parallel 2

      - name: Verify GPIO map
        run: grep -q 'GPIO_BY_INPUT\[4\] = {0, 2, 4, 6}' firmware/main.c

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: kvm-switcher-uf2
          path: build/kvm_switcher.uf2
